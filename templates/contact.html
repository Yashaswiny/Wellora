<section style="display: flex; justify-content: center; align-items: center; background-color: #e8d8f6; padding: 40px;">
    <div style="background-color: white; border-radius: 20px; padding: 30px; width: 60%; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
      <h2 style="color: #3f3f8f; font-family: 'Times New Roman', Times, serif; text-align: center;">Contact Us</h2>
      <p style="text-align: center; font-family: 'Times New Roman', Times, serif">We’re here to help you with your health queries and system support.</p>
      
      <div style="margin-top: 20px; font-family: 'Times New Roman', Times, serif">
        <p><strong>📍 Address:</strong> 123 HealthCare Road, MediTown, 456001</p>
        <p><strong>📧 Email:</strong> support@wellora.com</p>
        <p><strong>📞 Phone:</strong> +91 98765 43210</p>
      </div>
  
      <form action="/submit-form" method="POST" style="margin-top: 25px;">
        <label>Name:</label><br>
        <input type="text" name="name" required style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; margin-top: 5px;"><br><br>
  
        <label>Email:</label><br>
        <input type="email" name="email" required style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; margin-top: 5px;"><br><br>
  
        <label>Message:</label><br>
        <textarea name="message" rows="5" required style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; margin-top: 5px;"></textarea><br><br>
  
        <button type="submit" style="background-color: #3f3f8f; color: white; padding: 10px 20px; border: none; border-radius: 10px;">Send Message</button>
      </form>
    </div>
  </section>
